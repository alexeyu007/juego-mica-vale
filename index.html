<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mica &amp; Vale vs. El Resfrio</title>
<link rel="icon" type="image/png" href="assets/sprites/patito_ui.png">
<link rel="apple-touch-icon" href="assets/sprites/patito_ui.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff6fb5; --pinkDark:#e0479a; --purple:#8b5cf6; --purpleDark:#6d3fe0;
    --cream:#fff6fb;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#2a1b3d}
  body{
    font-family:'Baloo 2','Comic Sans MS','Trebuchet MS',sans-serif;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 20%,#5b3a7a 0%,#2a1b3d 70%);
    touch-action:manipulation;user-select:none;
  }
  #stage{position:relative;box-shadow:0 20px 60px rgba(0,0,0,.6);border-radius:22px;overflow:hidden}
  canvas{display:block;border-radius:22px}

  /* ---------- modo móvil: a pantalla completa ---------- */
  /* El escenario pasa a ocupar todo el viewport (barra del navegador incluida,
     con 100dvh de respaldo) y pierde redondeos y sombra: es el borde del móvil.
     La clase .movil la pone JS sólo cuando detecta móvil, así PC no cambia. */
  html.movil,body.movil{height:100vh;height:100dvh}
  #stage.full{
    width:100%;height:100vh;height:100dvh;
    border-radius:0;box-shadow:none;
  }
  #stage.full canvas{border-radius:0}
  /* el notch y la barra inferior no deben tapar los botones de esquina */
  #stage.full .overlay{padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
  #stage.full #topBtns{top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right))}
  #stage.full #loginBox{left:calc(12px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom))}
  #stage.full #btnTrofeo{right:calc(12px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom))}
  #stage.full #top5Panel{right:calc(12px + env(safe-area-inset-right))}

  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    color:#5b2a6b;padding:24px;
  }
  .hidden{display:none!important}

  /* ---------- MENÚ ---------- */
  /* el menú ya no tapa el lienzo: solo lleva un velo suave,
     así se ve el fondo del juego con las bebés detrás del menú */
  #menu{
    background:linear-gradient(180deg,rgba(255,255,255,.12) 0%,rgba(96,38,116,.32) 100%);
    justify-content:flex-start;             /* manda el flex, no el centrado */
    padding-top:10px;padding-bottom:16px;
  }
  /* La portada es la propia pantalla inicial (título y botón pintados en la imagen) */
  #menu{background:url('Arte/pantalla_inicial.png?v=20261021e') center center/auto 100% no-repeat,#ffd7ec}
  #menu .spacer{display:none}
  #menu .panel{display:none}
  #menu h1,#menu p,#menu .howto{display:none}
  /* el botón JUGAR real: transparente, apoyado sobre el play ya pintado de la portada
     (posición medida sobre Arte/pantalla_inicial.png: centro 40.4% X, 74.4% Y) */
  #btnPlay{
    position:absolute;left:40.4%;top:74.4%;transform:translate(-50%,-50%);
    width:46%;height:13%;padding:0;border:none;background:transparent;
    box-shadow:none;border-radius:999px;cursor:pointer;z-index:3;
    transition:transform .1s ease;
  }
  #btnPlay .btnArt,#btnPlay img,#btnPlay .btnLabel{display:none}
  #btnPlay:hover{transform:translate(-50%,-50%) scale(1.04)}
  #btnPlay:active{transform:translate(-50%,-50%) scale(.96)}
  .btn{
    font-family:inherit;font-weight:800;cursor:pointer;border:none;
    border-radius:999px;color:#fff;letter-spacing:.5px;
    box-shadow:0 6px 0 rgba(0,0,0,.18),0 10px 22px rgba(0,0,0,.25);
    transition:transform .08s ease,box-shadow .08s ease;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  #topBtns{position:absolute;top:12px;right:12px;display:flex;gap:8px;z-index:4}
  #topBtns .btn{
    font-size:20px;padding:6px 12px;
    background:rgba(255,255,255,.9);color:var(--purpleDark);box-shadow:0 4px 12px rgba(0,0,0,.25);
  }
  #btnVibra.off{opacity:.4;filter:grayscale(1)}
  /* abajo a la izquierda: entrar con Google (conserva sus estados) */
  #loginBox{position:absolute;left:12px;bottom:12px;z-index:5;
    background:rgba(255,255,255,.92);border:3px solid #cfe0ff;border-radius:18px;
    padding:8px 10px;display:flex;flex-direction:column;gap:6px;align-items:center;
    width:auto;max-width:46%}
  #loginBox .lbl{display:none}
  #btnGoogle{
    font-size:14px;padding:8px 14px;background:linear-gradient(180deg,#4f8dff,#2f6ae0);
    display:flex;align-items:center;gap:7px;
  }
  #btnGoogle .gicon{
    background:#fff;border-radius:50%;width:21px;height:21px;
    display:inline-flex;align-items:center;justify-content:center;
    font-weight:800;color:#4285f4;font-size:13px;font-family:Arial,sans-serif;
  }
  /* abajo a la derecha: trofeo del Top 5 */
  #btnTrofeo{
    position:absolute;right:12px;bottom:12px;font-size:20px;padding:6px 12px;
    background:rgba(255,255,255,.9);color:var(--purpleDark);
    box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:4;
  }
  #bestLine{margin-top:6px;font-size:13px;font-weight:700;color:#a05bb0;text-align:center}
  /* panel que se abre desde el trofeo */
  #top5Panel{position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:5;max-width:78%;max-height:38%;
    background:rgba(255,255,255,.94);border:3px solid #ffb6dd;border-radius:18px;
    padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  #top5Panel .top5{background:none;border:none;padding:0;margin:0;max-width:none;width:100%}
  #top5Panel .top5 h3{font-size:15px}
  #top5Panel .top5 ol{max-height:110px;overflow-y:auto;overscroll-behavior:contain}

  /* ---------- PAUSA / FIN ---------- */
  .panel2{
    background:rgba(255,255,255,.95);border:4px solid #ffb6dd;border-radius:26px;
    padding:22px 28px;box-shadow:0 12px 40px rgba(0,0,0,.4);max-width:400px;
  }
  .panel2 h2{font-size:34px;margin-bottom:6px}
  .panel2 p{font-size:17px;font-weight:600;margin:4px 0}
  .panel2 .btn{font-size:20px;padding:10px 26px;margin:8px 6px 0}
  #btnResume{background:linear-gradient(180deg,#9d7bff,var(--purpleDark))}
  #btnRestart{background:linear-gradient(180deg,#ff8ec9,var(--pinkDark))}
  #btnMenu{background:linear-gradient(180deg,#ffd36b,#eaa13c)}
  .endArt{display:flex;gap:10px;justify-content:center;margin:6px 0 2px}
  .endArt img{width:118px;image-rendering:auto;animation:bob 1.1s ease-in-out infinite}
  .endArt img:nth-child(2){animation-delay:.25s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  #endScore{font-size:22px;font-weight:800;color:var(--pinkDark);margin-top:6px}
  #pausePanel,#endPanel{background:rgba(60,25,80,.45);backdrop-filter:blur(3px)}

  /* ---------- TOP 5 ---------- */
  .top5{
    background:rgba(255,255,255,.9);border:3px solid #ffb6dd;border-radius:18px;
    padding:8px 14px;margin-top:6px;max-width:330px;width:100%;
  }
  .top5 h3{font-size:16px;color:var(--pinkDark)}
  .top5 ol{list-style:none;margin-top:4px}
  .top5 li{display:flex;justify-content:space-between;gap:10px;font-weight:700;
    font-size:15px;color:#5b2a6b;padding:2px 0}
  .top5 li .nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto}
  .top5 li .celda{display:flex;align-items:center;gap:6px;overflow:hidden;min-width:0}
  .top5 .miniAv{width:22px;height:22px;border-radius:50%;border:2px solid #fff;
    object-fit:cover;flex:none;background:#eee}
  .top5 li.vacio{color:#a98bb5;justify-content:center;font-weight:600;font-size:14px}
  #saveBox{margin:10px 0 4px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .saved{
    font-size:15px;font-weight:800;color:#1e9e6a;text-align:center;
    background:#e9fbf3;border:2px solid #9ee7c7;border-radius:999px;
    padding:7px 16px;max-width:100%;
  }
  .saved.local{color:#8a5a00;background:#fff6e2;border-color:#ffd79a}
  #btnGoogleEnd{font-size:15px;padding:9px 18px;background:linear-gradient(180deg,#4f8dff,#2f6ae0);
    display:flex;align-items:center;gap:9px}
  #btnGoogleEnd .gicon{background:#fff;border-radius:50%;width:22px;height:22px;
    display:inline-flex;align-items:center;justify-content:center;
    font-weight:800;color:#4285f4;font-size:13px;font-family:Arial,sans-serif}

  /* ---------- LOGIN GOOGLE ---------- */
  .userChip{
    display:flex;align-items:center;gap:9px;background:#eef4ff;
    border-radius:999px;padding:5px 12px 5px 5px;max-width:100%;
  }
  .userChip img{width:34px;height:34px;border-radius:50%;border:2px solid #fff;object-fit:cover}
  .userChip .uname{font-weight:800;color:#2f4a8a;font-size:15px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
  #btnLogout{
    font-size:13px;padding:5px 12px;background:linear-gradient(180deg,#c9c9d6,#9a9aae);
    box-shadow:0 3px 8px rgba(0,0,0,.18);
  }
  #endUser{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 2px}

  /* ---------- TOAST ---------- */
  #hint{
    position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
    background:rgba(255,255,255,.93);color:#7a3a86;font-weight:700;font-size:14px;
    padding:8px 16px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.3);
    pointer-events:none;transition:opacity .4s;white-space:nowrap;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <!-- MENÚ: portada pantalla_inicial.png -->
  <div id="menu" class="overlay">
    <div id="topBtns">
      <button id="btnVibra" class="btn" title="Vibración">📳</button>
      <button id="btnSound" class="btn" title="Sonido">🔊</button>
    </div>

    <!-- botón real: transparente sobre el play pintado de la portada -->
    <button id="btnPlay" class="btn" aria-label="Jugar"></button>

    <!-- abajo a la izquierda: entrar con Google -->
    <div id="loginBox">
      <button id="btnGoogle" class="btn"><span class="gicon">G</span>Google</button>
      <div id="userChipBox" class="hidden" style="align-items:center;gap:6px">
        <div class="userChip"><img id="menuAvatar" src="" alt=""><span class="uname" id="menuName"></span></div>
        <button id="btnLogout" class="btn">Salir</button>
      </div>
    </div>

    <!-- abajo a la derecha: trofeo del Top 5 (abre la lista) -->
    <button id="btnTrofeo" class="btn" aria-label="Top 5">🏆</button>

    <!-- panel del Top 5 -->
    <div id="top5Panel" class="hidden">
      <div class="top5">
        <h3 id="top5TitleMenu">🏆 Top 5 jugadores</h3>
        <ol id="top5Menu"><li class="vacio">Sin registros aún</li></ol>
        <div id="bestLine"></div>
      </div>
    </div>
  </div>

  <!-- PAUSA -->
  <div id="pausePanel" class="overlay hidden">
    <div class="panel2">
      <h2>⏸ Pausa</h2>
      <p>Las bebés te esperan…</p>
      <button id="btnResume" class="btn">▶ Reanudar</button>
      <button id="btnRestart" class="btn">🔄 Reiniciar</button>
      <button id="btnMenu" class="btn">🏠 Menú</button>
    </div>
  </div>

  <!-- FINAL -->
  <div id="endPanel" class="overlay hidden">
    <div class="panel2">
      <h2 id="endTitle">¡Ganaste!</h2>
      <div class="endArt">
        <img id="endImg1" src="assets/sprites/mica_celebrando.png" alt="Mica">
        <img id="endImg2" src="assets/sprites/vale_celebrando.png" alt="Vale">
      </div>
      <p id="endMsg"></p>
      <div id="endScore"></div>
      <div id="endUser" class="hidden">
        <div class="userChip"><img id="endAvatar" src="" alt=""><span class="uname" id="endName"></span></div>
      </div>
      <div id="saveBox">
        <div id="savedLine" class="saved"></div>
        <button id="btnGoogleEnd" class="btn"><span class="gicon">G</span>Entra con Google para el Top 5 mundial</button>
      </div>
      <div class="top5" style="max-width:100%">
        <h3 id="top5TitleEnd">🏆 Top 5 jugadores</h3>
        <ol id="top5End"><li class="vacio">Sin registros aún</li></ol>
      </div>
      <button id="btnAgain" class="btn" style="background:linear-gradient(180deg,#ff8ec9,#e0479a)">🔄 Jugar otra vez</button>
      <button id="btnMenu2" class="btn" style="background:linear-gradient(180deg,#ffd36b,#eaa13c)">🏠 Menú</button>
    </div>
  </div>

  <div id="hint" class="hidden"></div>
</div>

<script src="js/game.js?v=20261021h"></script>
</body>
</html>
